<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Anwesen</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <div id="game-container">
        <!-- UI Bar oben für Wahnsinn / Sanity -->
        <div id="ui-bar">
            <span id="sanity-label">WAHNSINN:</span>
            <div id="sanity-bar-outer">
                <div id="sanity-bar-inner"></div>
            </div>
        </div>

        <!-- Bildbereich -->
        <div id="image-wrapper">
            <img id="story-bild" src="intro.png.jpg" alt="Horror Szene">
        </div>

        <!-- Textbereich -->
        <p id="story-text">Lade Spiel...</p>

        <!-- Dynamic Buttons -->
        <div id="button-container"></div>
    </div>

</body>
</html>
